name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (csc.exe из .NET Framework 4)
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: SiteWatch
          path: SiteWatch.exe
